<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    
      <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/dom.css" />
    <title>Ejercicios del DOM</title>
  </head>

  <body>
    
    <!-- Header principal -->
    <header class="bg-primary text-white text-center py-4">
      <h1>Ejercicios del DOM</h1>
    </header>

    <!-- Botón tipo hamburguesa -->
    <button class="panel-btn hamburger" type="button">
      <span class="burger-box">
        <span class="hamburger-inner"></span>
      </span>
    </button>

    <!-- Panel lateral con navegación -->
    <aside class="panel">
      <nav class="menu">
        <ul>
          <li>
            <a href="#seccion1">Reloj Digital y Alarma Sonora</a>
          </li>
          <li><a href="#seccion2">Eventos del teclado</a></li>
          <li><a href="#seccion3">Cuenta Regresiva</a></li>
          <li><a href="#seccion4">Sección 4</a></li>
          <li><a href="#seccion5">Sección 5</a></li>
        </ul>
      </nav>
    </aside>
    <main class="container mt-4">
      <section id="seccion1" class="section mb-5">
        <h2>Reloj Digital y Alarma Sonora</h2>

        <!-- Div vacío para mostrar el reloj -->
        <div id="reloj"></div>

        <!-- Contenedor de botones -->
        <div class="fila flex centrada">
          <button id="activar-reloj">Iniciar Reloj</button>
          <button id="desactivar-reloj">Detener Reloj</button>
          <button id="activar-alarma">Iniciar Alarma</button>
          <button id="desactivar-alarma">Detener Alarma</button>
        </div>
      </section>
      <section id="seccion2" class="section mb-5">
        <h2>Eventos del teclado</h2>
        <article class="stage">
          <div class="ball"></div>
        </article>
      </section>
      <section id="seccion3" class="section mb-5">
        <h2>Cuenta regresiva</h2>
        <div id="countdown"></div>
      </section>
      <section id="seccion4" class="section mb-5">
        <h2>Sección 4</h2>
      </section>
      <section id="seccion5" class="section mb-5">
        <h2>Sección 5</h2>
      </section>
    </main>

    <!-- secciones del contendio -->
  </body>
  <script type="module" src="js/index_dom.js"></script>
</html>
