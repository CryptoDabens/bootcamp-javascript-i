<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css"/>
    
</head>
<body>
    <div class="cabecero">
        <div class"presupuesto">
            <div class="presupuesto_titulo">
                <h1>"Presupuesto Disponible"<h1>
            </div>
            <div class="presupuesto_valor">
                "+2,000.00"
            </div>
            <div class="presupuesto_ingreso" class="limpiarEstilos">
                <div class="presupuesto_ingreso--text">"Ingresos"</div>
                <div class="derecha">
                    <div class="presupuesto_ingreso--valor">"+4,000.00"</div>
                    <div class="presupuesto_ingreso--porcentaje">" "</div>
                    <div class="presupuesto_egreso" class="limpiarEstilos">
                        <div class="presupuesto_egreso--texto">"Egresos"</div>
                        <div class="derecha"> class="limpiarEstilos">
                            <div class="presupuesto_egreso--valor">"-1,900.00"</div>
                            <div class="presupuesto_egreso--porcentahe">"45%"</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        </div>
    </div>
<form id="forma">
    <div class="agregar">
        <div class="agregar_contenedor">
            <select class="agregar_tipo" id="tipo">
                <option value="ingreso" selected>+</option>
                <option value="egreso">-</option>
            </select>
            <input type="text" class="agregar_descripcion" id="descripcion">
            "Agregar Descripción"
            </input>
            <input type="number" class="agregar_valor" id="valor" step="any">
            "Valor"
            </input>
            <button class="agregar_btn">
                <label for="ion-icon"></label>
            </button> 
<input>
        </div>
    </div>
</form>


</body>

</html>
