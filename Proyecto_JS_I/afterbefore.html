<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo Visual ::before y ::after</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px;
  }

  h2 {
    margin-top: 40px;
    border-bottom: 2px solid #ccc;
    padding-bottom: 5px;
  }

  .demo-box {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* 1) Badge */
  .badge {
    position: relative;
    display: inline-block;
    padding: 10px 20px;
    background: #3498db;
    color: white;
    border-radius: 6px;
  }
  .badge::after {
    content: "3";
    position: absolute;
    top: -8px;
    right: -8px;
    background: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
  }

  /* 2) Flecha */
  .flecha {
    width: 120px;
    height: 40px;
    background: #2ecc71;
    position: relative;
  }
  .flecha::after {
    content: "";
    position: absolute;
    right: -20px;
    top: 0;
    border-top: 20px solid transparent;
    border-bottom: 20px solid transparent;
    border-left: 20px solid #2ecc71;
  }

  /* 3) Subrayado animado */
  .subrayado {
    display: inline-block;
    position: relative;
    font-size: 22px;
    cursor: pointer;
  }
  .subrayado::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -5px;
    width: 0%;
    height: 3px;
    background: #e74c3c;
    transition: width .3s;
  }
  .subrayado:hover::after {
    width: 100%;
  }

  /* 4) Overlay */
  .overlay {
    position: relative;
    display: inline-block;
  }
  .overlay img {
    width: 300px;
    border-radius: 10px;
  }
  .overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
  }

  /* 5) Tooltip */
  .tooltip {
    background: #333;
    color: white;
    padding: 10px;
    border-radius: 6px;
    position: relative;
    display: inline-block;
  }
  .tooltip::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 20px;
    border-width: 10px;
    border-style: solid;
    border-color: #333 transparent transparent transparent;
  }

  /* 6) Separador elegante */
  .separador {
    position: relative;
    text-align: center;
    font-size: 20px;
    margin-top: 30px;
  }
  .separador::after {
    content: "";
    position: absolute;
    width: 60%;
    height: 2px;
    background: #ccc;
    left: 20%;
    bottom: -10px;
  }

  /* 7) Botón con ícono */
  .btn-icon {
    position: relative;
    padding: 10px 40px 10px 20px;
    background: #8e44ad;
    color: white;
    border-radius: 6px;
    display: inline-block;
  }
  .btn-icon::after {
    content: "💾";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
  }

</style>
</head>

<body>

<h1>Catálogo Visual de ::before y ::after</h1>

<h2>1) Badge / Notificación</h2>
<div class="demo-box">
  <div class="badge">Mensajes</div>
</div>

<h2>2) Flecha CSS</h2>
<div class="demo-box">
  <div class="flecha"></div>
</div>

<h2>3) Subrayado Animado</h2>
<div class="demo-box">
  <div class="subrayado">Hover aquí</div>
</div>

<h2>4) Overlay sobre imagen</h2>
<div class="demo-box">
  <div class="overlay">
    <img src="https://picsum.photos/300">
  </div>
</div>

<h2>5) Tooltip</h2>
<div class="demo-box">
  <div class="tooltip">Tooltip</div>
</div>

<h2>6) Separador elegante</h2>
<div class="demo-box">
  <div class="separador">Título</div>
</div>

<h2>7) Botón con ícono sin HTML extra</h2>
<div class="demo-box">
  <div class="btn-icon">Guardar</div>
</div>

</body>
</html>
